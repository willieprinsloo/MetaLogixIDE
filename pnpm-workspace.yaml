# single-package workspace

# pnpm >=10 reads settings from this file instead of .npmrc — mirror the
# hoisted layout configured there (see .npmrc for why electron-builder
# needs it) so newer pnpm versions don't silently fall back to symlinks.
nodeLinker: hoisted
shamefullyHoist: true

allowBuilds:
  # SQLite ships platform binaries; the root install explicitly prepares Electron.
  better-sqlite3: false
  electron: false
  esbuild: true
  keytar: true
  node-pty: true

patchedDependencies:
  '@xterm/addon-webgl@0.18.0': patches/@xterm__addon-webgl@0.18.0.patch
